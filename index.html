<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pwede ba kitang ligawan Exclusively?</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <div>
            <h1 class="header_text">Pwede ba kitang ligawan Exclusively?</h1>
        </div>
        <div class="gif_container">
            <img src="https://i.postimg.cc/pdNqPxx1/milk-and-mocha-cute.gif" alt="Cute animated illustration" />
        </div>
        <div class="buttons">
            <button class="btn" id="yesButton" onclick="nextPage()">Yes</button>
            <button class="btn" id="noButton" onmouseover="moveButton()" onclick="moveButton()">
          No
        </button>

            <script>
                let yesNotified = false;

                async function notifyYes() {
                    try {
                        localStorage.setItem("yesClickedAt", new Date().toISOString());
                        if ("Notification" in window) {
                            if (Notification.permission === "default") await Notification.requestPermission();
                            if (Notification.permission === "granted") {
                                new Notification("Yes was clicked", { body: "Your invitation was accepted." });
                            }
                        }
                    } catch (error) {
                        // Browser notifications and local storage are optional.
                    }
                }

                function nextPage() {
                    document.getElementById("datePopup").classList.add("show");
                    if (!yesNotified) {
                        yesNotified = true;
                        void notifyYes();
                    }
                }

                function moveButton() {
                    var x =
                        Math.random() *
                        (window.innerWidth -
                            document.getElementById("noButton").offsetWidth);
                    var y =
                        Math.random() *
                        (window.innerHeight -
                            document.getElementById("noButton").offsetHeight);
                    document.getElementById("noButton").style.left = `${x}px`;
                    document.getElementById("noButton").style.top = `${y}px`;
                }
            </script>
        </div>
    </div>
    <div class="popup" id="datePopup" role="dialog" aria-modal="true" aria-label="Response">
        <div class="popup_card">Let's go on a coffee date.</div>
    </div>
</body>

</html>
